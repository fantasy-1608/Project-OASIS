<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aladinn OASIS Promo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100vw; height: 100vh; margin: 0; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 152px 1fr;
        align-items: center;
        padding: 28px;
        color: #fff;
        background:
          radial-gradient(circle at 15% 20%, rgba(245, 191, 78, .22), transparent 38%),
          linear-gradient(135deg, #172033, #101827 62%, #07101d);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      img { width: 124px; height: 124px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, .42); }
      .eyebrow { color: #f5bf4e; font-size: 13px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 8px 0 10px; font-size: 31px; line-height: 1.05; letter-spacing: -.03em; }
      p { margin: 0; color: #dbe5f3; font-size: 15px; line-height: 1.4; }
      .pill { display: inline-block; margin-top: 16px; padding: 7px 11px; border: 1px solid rgba(245, 191, 78, .45); border-radius: 999px; color: #ffe1a0; font-size: 12px; font-weight: 650; }
    </style>
  </head>
  <body>
    <img src="../public/icon128.png" alt="" />
    <section>
      <div class="eyebrow">Aladinn OASIS</div>
      <h1>Bảng dự kiến mổ nội bộ</h1>
      <p>Tích hợp VNPT HIS trong side panel bảo mật.</p>
      <div class="pill">Nhanh · Rõ · An toàn</div>
    </section>
  </body>
</html>
